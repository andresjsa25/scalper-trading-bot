name: CI

on:
  pull_request:
  push:
    branches: [main]

# Mínimo privilegio: el token solo puede leer el código. Sin secrets del repo.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # 3.12 es la versión con la que corre el bot (run_live_trading.bat)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q

  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0: gitleaks escanea el historial completo, no solo el último commit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Binario de release fijado y verificado por SHA-256 (sin action de terceros ni token extra)
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Exit 1 si encuentra cualquier secreto: el PR queda en rojo
      - name: Escanear secretos
        run: ./gitleaks git --redact --verbose --no-banner --exit-code 1 .
